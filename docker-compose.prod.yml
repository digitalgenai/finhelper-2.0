services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    # Em produção no Coolify, as variáveis de ambiente serão injetadas pelo painel do Coolify.
    # Isso evita ter que enviar o arquivo .env com chaves secretas para o Git.
    restart: unless-stopped
